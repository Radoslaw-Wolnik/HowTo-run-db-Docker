services:
  sqlite:
    image: keinos/sqlite3:latest
    container_name: uni-sqlite
    environment:
      SQLITE_DATABASE_FILE: ${SQLITE_DATABASE_FILE}
    working_dir: /workspace
    volumes:
      - ./:/workspace
    command: ["sh", "-c", "sqlite3 /workspace/$${SQLITE_DATABASE_FILE} '.read /workspace/init/01_books.sql'"]
